name: Publish release images

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ori-os-api
            dockerfile: Dockerfile.api
          - name: worker
            image: ori-os-worker
            dockerfile: Dockerfile.worker
          - name: web
            image: ori-os-web
            dockerfile: Dockerfile.web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.ORI_OS_PUBLIC_API_URL || 'https://orios.ori-craftlabs.com/api' }}
            NEXT_PUBLIC_APP_URL=${{ vars.ORI_OS_PUBLIC_APP_URL || 'https://orios.ori-craftlabs.com' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.ORI_OS_PUBLIC_SENTRY_DSN || '' }}
            NEXT_PUBLIC_AUTH_BYPASS=0
            NEXT_PUBLIC_ENABLE_OPERATIONS_CORE=${{ vars.ORI_OS_ENABLE_OPERATIONS_CORE || 'true' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
