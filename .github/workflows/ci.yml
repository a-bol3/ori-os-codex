name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ori_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ori_os"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ori_os
      AUTH_SECRET: ci-secret-placeholder-32-characters-long
      NEXTAUTH_SECRET: ci-secret-placeholder-32-characters-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      ORI_AUTH_BYPASS: "0"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@ori-os/db

      - name: Build all workspaces
        run: npm run build

      - name: Lint all workspaces
        run: npm run lint -- --concurrency=2

      - name: Run unit and integration tests
        run: npm run test -- --concurrency=2
