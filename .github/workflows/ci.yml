name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ori-os/db generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ori_os

      - name: Build
        run: pnpm turbo run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ori_os
          NEXTAUTH_SECRET: ci-secret-placeholder-32chars-min
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:4000
